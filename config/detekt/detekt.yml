build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 12
    thresholdInObjects: 20
    thresholdInEnums: 10
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 20
  NestedBlockDepth:
    threshold: 5

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

exceptions:
  TooGenericExceptionCaught:
    active: false # Intentional in boundary mappers that rethrow CancellationException first
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true # AGENTS.md: operator !! is strictly forbidden

style:
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  MagicNumber:
    active: false # Domain/DSP pixel & codec tuning constants live cleanly in named companion constants
  ReturnCount:
    max: 5
  WildcardImport:
    active: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
